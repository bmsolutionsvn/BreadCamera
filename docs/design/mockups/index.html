<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreadCamera Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #22D3EE; --cyan-hover: #67E8F9; --cyan-wash: rgba(34,211,238,0.13); --ink: #04191D;
  --plate: #08090B; --rail: #060709; --surface: #0E1013; --surface-hover: #13161B; --surface-raised: #16191F;
  --hair: rgba(255,255,255,0.10); --hair-subtle: rgba(255,255,255,0.06); --hair-strong: rgba(255,255,255,0.18);
  --tick: rgba(255,255,255,0.28);
  --text: #F5F7FA; --muted: rgba(245,247,250,0.62); --dim: rgba(245,247,250,0.50); --disabled: rgba(245,247,250,0.34);
  --live: #EF4444; --live-t: #FF6B6B; --conn: #F59E0B; --conn-t: #FBBF24; --ready: #22C55E; --ready-t: #4ADE80;
  --off: rgba(245,247,250,0.30); --off-t: rgba(245,247,250,0.50);
  --danger: #FB7185; --warning: #FBBF24; --success: #4ADE80; --info: #38BDF8;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace;
  --ease: cubic-bezier(.2,0,0,1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--plate); color: var(--text); font: 400 14px/1.5 var(--sans); caret-color: var(--cyan); overflow: hidden; }
::selection { background: var(--cyan-wash); color: var(--text); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 999px; border: 3px solid var(--plate); }
::-webkit-scrollbar-track { background: transparent; }
.num, .mono { font-family: var(--mono); font-feature-settings: 'tnum' 1, 'lnum' 1; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* mockup chrome (not part of the app) */
.mockbar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: #000; border-bottom: 1px solid var(--hair); overflow-x: auto; white-space: nowrap; }
.mockbar .tag { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-right: 8px; }
.mockbar button { font: 500 12px var(--sans); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.mockbar button:hover { color: var(--text); background: var(--surface-hover); }
.mockbar button[aria-selected="true"] { color: var(--text); border-color: var(--hair-strong); }
.mockbar .note { margin-left: auto; font-size: 12px; color: var(--dim); padding-left: 16px; }

/* app shell */
.app { display: grid; grid-template-columns: 208px 1fr; height: calc(100vh - 40px); }
.rail { background: var(--rail); border-right: 1px solid var(--hair); display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-weight: 700; letter-spacing: -0.02em; }
.brand-mark { width: 20px; height: 20px; border: 1px solid var(--cyan); border-radius: 4px; display: grid; place-items: center; color: var(--cyan); }
.show-pick { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--hair); border-radius: 6px; background: var(--surface); cursor: pointer; }
.show-pick small { display: block; font-size: 12px; color: var(--dim); }
.show-pick span { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; transition: background .12s var(--ease), color .12s var(--ease); }
.nav:hover { background: var(--surface-hover); color: var(--text); }
.nav.on { background: var(--cyan-wash); color: var(--cyan); font-weight: 700; }
.rail .spacer { flex: 1; }
.engine-line { padding: 10px 10px 4px; border-top: 1px solid var(--hair-subtle); margin-top: 6px; font-size: 12px; color: var(--dim); display: grid; gap: 2px; }
.engine-line b { font-weight: 500; color: var(--muted); }
.stop-all { margin: 6px 2px 0; height: 32px; border-radius: 6px; border: 1px solid var(--hair); background: none; color: var(--danger); font: 600 13px var(--sans); cursor: pointer; }
.stop-all:hover { border-color: var(--danger); }

.main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 16px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--hair); background: var(--plate); }
.top h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.top h1 .cam-id { font: 500 13px var(--mono); color: var(--dim); letter-spacing: 0; }
.meta { display: flex; gap: 14px; color: var(--muted); font: 400 13px var(--mono); white-space: nowrap; }
.meta .sep { color: var(--disabled); }
.top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { height: 36px; padding: 0 16px; border-radius: 6px; font: 600 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; transition: background .12s var(--ease), border-color .12s var(--ease); white-space: nowrap; }
.btn-primary { background: var(--cyan); color: var(--ink); }
.btn-primary:hover { background: var(--cyan-hover); }
.btn-outline { background: none; color: var(--text); border-color: var(--hair-strong); }
.btn-outline:hover { background: var(--surface-hover); }
.btn-danger { background: var(--danger); color: #2A0A10; }
.btn-ghost-danger { background: none; color: var(--danger); border-color: var(--hair); }
.btn-ghost-danger:hover { border-color: var(--danger); }
.btn:focus-visible, .nav:focus-visible, .tile:focus-visible { outline: 1px solid var(--cyan); outline-offset: -1px; }
.icon-btn { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--hair); background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--surface-hover); }

.work { position: relative; min-height: 0; overflow: auto; }

/* multiview wall */
.wall-wrap { height: 100%; display: flex; flex-direction: column; }
.wall-area { flex: 1; min-height: 0; display: grid; place-items: center; padding: 2px; }
.wall { display: grid; gap: 2px; }
.tile { display: flex; flex-direction: column; background: var(--surface); cursor: pointer; min-width: 0; position: relative; overflow: hidden; }
.pic { aspect-ratio: 16 / 9; background: #000; overflow: hidden; position: relative; }
.pic svg { display: block; width: 100%; height: 100%; }
.strip { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid var(--hair); font-size: 13px; transition: background .12s var(--ease); min-width: 0; }
.tile:hover .strip { background: var(--surface-hover); }
.strip.warn { box-shadow: inset 2px 0 0 var(--warning); background: rgba(251,191,36,0.08); }
.strip.err { box-shadow: inset 2px 0 0 var(--danger); background: rgba(251,113,133,0.08); }
.tile:hover .strip.warn { background: rgba(251,191,36,0.12); }
.tile:hover .strip.err { background: rgba(251,113,133,0.12); }
.in-chip { height: 20px; min-width: 38px; padding: 0 6px; border-radius: 4px; display: inline-grid; place-items: center; font: 600 11px var(--mono); letter-spacing: .06em; color: var(--ink); flex: none; }
.in-chip.live { background: var(--live); } .in-chip.conn { background: var(--conn); } .in-chip.ready { background: var(--ready); }
.in-chip.off { background: var(--off); color: var(--text); }
.in-chip.err { background: var(--danger); color: #2A0A10; }
.cam-no { font: 500 12px var(--mono); color: var(--dim); flex: none; }
.cam-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.fx { display: flex; gap: 4px; color: var(--muted); flex: none; }
.fx svg.i { width: 14px; height: 14px; }
.fx .bad { color: var(--danger); }
.fx .unused { color: var(--disabled); }
.flow { color: var(--disabled); flex: none; } .flow svg.i { width: 14px; height: 14px; }
.outs { display: flex; gap: 4px; flex: none; }
.pill { height: 20px; padding: 0 7px 0 6px; border-radius: 999px; border: 1px solid; display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--mono); letter-spacing: .06em; }
.pill i { width: 6px; height: 6px; border-radius: 50%; }
.pill.live { color: var(--live-t); border-color: rgba(239,68,68,.55); } .pill.live i { background: var(--live); animation: pulse 2s ease-in-out infinite alternate; }
.pill.conn { color: var(--conn-t); border-color: rgba(245,158,11,.55); } .pill.conn i { background: var(--conn); }
.pill.ready { color: var(--ready-t); border-color: rgba(34,197,94,.55); } .pill.ready i { background: var(--ready); }
.pill.off { color: var(--off-t); border-color: var(--hair-strong); } .pill.off i { background: var(--off); }
.err-chip { height: 20px; padding: 0 6px; border-radius: 4px; border: 1px solid rgba(251,113,133,.6); background: rgba(251,113,133,.08); color: var(--danger); display: inline-flex; align-items: center; gap: 4px; font: 500 11px var(--mono); letter-spacing: .06em; }
.err-chip svg.i { width: 12px; height: 12px; }
.more { font: 500 11px var(--mono); color: var(--muted); padding: 0 2px; }
.seen { display: inline-flex; align-items: center; gap: 3px; color: var(--info); font: 500 11px var(--mono); flex: none; }
.seen svg.i { width: 12px; height: 12px; }
@keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.live i { animation: none; } }

/* blocks */
.block { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; font-size: 13px; border-left: 2px solid; }
.block svg.i { margin-top: 2px; }
.block b { font-weight: 600; }
.block .detail { color: var(--muted); }
.block.warning { border-color: var(--warning); background: rgba(251,191,36,0.08); color: var(--text); } .block.warning svg { color: var(--warning); }
.block.danger { border-color: var(--danger); background: rgba(251,113,133,0.08); } .block.danger svg { color: var(--danger); }
.warn-chip { height: 24px; padding: 0 8px; border-radius: 4px; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.4); color: var(--warning); font: 500 12px var(--mono); display: inline-flex; align-items: center; gap: 6px; }

/* empty */
.empty { height: 100%; display: grid; place-items: center; }
.empty > div { max-width: 420px; text-align: center; display: grid; justify-items: center; gap: 10px; }
.empty-frame { width: 168px; aspect-ratio: 16/9; border: 1px dashed var(--hair-strong); border-radius: 6px; display: grid; place-items: center; color: var(--dim); margin-bottom: 8px; position: relative; }
.empty h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.empty p { color: var(--muted); }

/* detail + panels */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair-subtle); }
.panel-h h3 { font-size: 14px; font-weight: 600; }
.panel-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel-b { padding: 14px 16px 16px; display: grid; gap: 14px; }
.state { height: 22px; padding: 0 8px; border-radius: 4px; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; border: 1px solid; }
.state.run { color: var(--success); border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.08); }
.state.bypass { color: var(--danger); border-color: rgba(251,113,133,.5); background: rgba(251,113,133,.08); }
.state.unused { color: var(--dim); border-color: var(--hair); }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--dim); }
.input { height: 40px; border-radius: 4px; background: var(--surface); border: 1px solid var(--hair); color: var(--text); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 400 14px var(--sans); min-width: 0; }
.input:hover { border-color: var(--hair-strong); }
.input.focus { border-color: var(--cyan); }
.input .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.input .v.mono { font-size: 13px; }
.input .unit { color: var(--dim); font: 400 12px var(--mono); }
.input svg.i { color: var(--dim); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 6px; padding: 2px; gap: 2px; }
.seg span { height: 30px; padding: 0 12px; display: grid; place-items: center; border-radius: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg span.on { background: var(--surface-raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--hair-strong); }
.switch { width: 34px; height: 20px; border-radius: 999px; background: var(--hair-strong); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); }
.switch.on { background: var(--cyan); } .switch.on::after { left: 17px; background: var(--ink); }
.slider { display: grid; grid-template-columns: 1fr 84px; gap: 12px; align-items: center; }
.track { height: 4px; border-radius: 2px; background: var(--hair-strong); position: relative; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: rgba(245,247,250,.62); border-radius: 2px; }
.track .knob { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transform: translate(-50%, -50%); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.track .zero { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--tick); }
.sl-v { white-space: nowrap; height: 28px; border: 1px solid var(--hair); border-radius: 4px; display: grid; place-items: center end; padding: 0 8px; font: 400 13px var(--mono); }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { font-family: var(--mono); font-size: 13px; }
.preview-big .pic { border-radius: 6px 6px 0 0; }
.preview-big .strip { border: 1px solid var(--hair); border-top: none; border-radius: 0 0 6px 6px; height: 36px; }
table.outs-t { width: 100%; border-collapse: collapse; font-size: 13px; }
.outs-t th { text-align: left; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 8px 16px; border-bottom: 1px solid var(--hair-subtle); }
.outs-t td { padding: 10px 16px; border-bottom: 1px solid var(--hair-subtle); vertical-align: middle; }
.outs-t tr:last-child td { border-bottom: none; }
.outs-t td.mono { font-size: 12px; color: var(--muted); }
.outs-t tr.err-row td { padding: 0; }
.chip { height: 22px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--hair); color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; }

/* colour match */
.cm { display: grid; grid-template-columns: 288px minmax(0,1fr); height: 100%; min-height: 0; }
.cm-list { border-right: 1px solid var(--hair); padding: 12px 8px; overflow: auto; display: grid; align-content: start; gap: 2px; }
.cm-list h4 { font-size: 12px; font-weight: 500; color: var(--dim); padding: 4px 8px 8px; }
.cm-cam { display: grid; grid-template-columns: 16px 64px 1fr; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.cm-cam:hover { background: var(--surface-hover); }
.cm-cam.on { background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--hair-strong); }
.cm-cam .thumb { aspect-ratio: 16/9; border-radius: 3px; overflow: hidden; background: #000; }
.cm-cam .thumb svg { display: block; width: 100%; height: 100%; }
.cm-cam .n { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-cam .s { font: 400 12px var(--mono); color: var(--dim); white-space: nowrap; }
.cm-cam .s.ok { color: var(--success); }
.check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--hair-strong); display: grid; place-items: center; }
.check.on { background: var(--text); border-color: var(--text); color: var(--plate); }
.check svg.i { width: 12px; height: 12px; stroke-width: 2.25; }
.ref-mark { font: 500 10px var(--mono); letter-spacing: .08em; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 4px; padding: 0 4px; height: 16px; display: grid; place-items: center; }
.cm-main { padding: 16px; overflow: auto; display: grid; gap: 16px; align-content: start; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pair figure { display: grid; gap: 8px; }
.pair figcaption { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.pair figcaption .lbl { color: var(--muted); }
.pair figcaption b { font-weight: 600; }
.pair figcaption .right { margin-left: auto; }
.pair .pic { border-radius: 6px; }
.region { position: absolute; border: 1px solid rgba(245,247,250,.55); }
.region::before, .region::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--text); }
.region::before { left: -2px; top: -2px; border-right: none; border-bottom: none; }
.region::after { right: -2px; bottom: -2px; border-left: none; border-top: none; }
.region span { position: absolute; left: 0; top: -22px; font: 500 11px var(--mono); letter-spacing: .06em; color: var(--text); background: rgba(8,9,11,.8); padding: 2px 6px; border-radius: 3px; }
.link { color: var(--muted); font-size: 13px; background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--hair-strong); }
.link:hover { color: var(--text); }
.hint-line { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.cm-bottom { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 16px; align-items: start; }
.trims { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.de { display: flex; align-items: baseline; gap: 10px; }
.de .val { font: 500 28px var(--mono); letter-spacing: -0.02em; }
.de .was { color: var(--dim); font: 400 13px var(--mono); }

/* settings */
.settings { max-width: 760px; padding: 20px; display: grid; gap: 16px; }
.slate-thumb { width: 160px; aspect-ratio: 16/9; border-radius: 4px; border: 1px solid var(--hair); overflow: hidden; }
.slate-thumb svg { display: block; width: 100%; height: 100%; }

/* dialog */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.62); display: grid; place-items: center; z-index: 10; }
.dialog { width: 520px; max-width: calc(100% - 32px); background: var(--surface-raised); border: 1px solid var(--hair); border-radius: 6px; box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4); }
.dialog h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; padding: 20px 24px 0; }
.dialog .body { padding: 12px 24px 4px; display: grid; gap: 14px; color: var(--muted); }
.dialog .body strong { color: var(--text); font-weight: 600; }
.dialog .body .field label { color: var(--muted); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 20px 24px 20px; }
.dialog .input { background: var(--surface); }
.list-out { display: grid; gap: 4px; font: 400 12px var(--mono); color: var(--muted); border: 1px solid var(--hair); border-radius: 4px; padding: 10px 12px; background: var(--surface); }
.list-out div { display: flex; gap: 8px; align-items: center; }

.syn { position: absolute; right: 6px; top: 6px; font: 500 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.42); pointer-events: none; }
.screen[hidden] { display: none; }
</style>
</head>
<body>
<nav class="mockbar" role="tablist" aria-label="Mockup screens">
  <span class="tag">Mockup</span>
</nav>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main" id="main"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#141414"/><rect width="8" height="8" fill="#1F1F1F"/><rect x="8" y="8" width="8" height="8" fill="#1F1F1F"/>
    </pattern>
  </defs>
</svg>

<script>
const I = {

  { n: 8, name: 'Cầu nối Hà Nội', scene: 'hanoi', in: 'SRT', st: 'conn', slate: true, fx: ['on','on','on'], outs: [['NDI','live']], strip: 'err' }
];
const FX = [['matte', 'Background removal'], ['bg', 'Background'], ['color', 'Colour match']];
const FXSTATE = { on: 'running', off: 'not used', bad: 'bypassed after an error' };

function strip(c, maxOuts = 4, frozenAll = false, dense = false) {
  const st = frozenAll ? 'off' : c.st;
  const chipText = c.slate ? 'SLATE' : (c.hold || c.in);
  const chipCls = c.slate ? 'err' : st;
  const chipTitle = c.slate ? `${IN_NAMES[c.in]} — signal lost, showing the slate` : c.hold ? `${IN_NAMES[c.in]} — signal lost, holding the last frame (${c.hold} left)` : `${IN_NAMES[c.in]} — ${ST[st]}`;
  const fx = FX.map(([k, label], i) => (dense && c.fx[i] === 'on') ? '' : `<span class="${c.fx[i] === 'bad' ? 'bad' : c.fx[i] === 'off' ? 'unused' : ''}" title="${label} — ${FXSTATE[c.fx[i]]}" aria-label="${label} — ${FXSTATE[c.fx[i]]}">${icon(k)}</span>`).join('');
  const shown = c.outs.slice(0, maxOuts), rest = c.outs.length - shown.length;
  const outs = shown.map(([k, s, note]) => {
    if (frozenAll) s = 'off';
    if (s === 'err') return `<span class="err-chip" title="${OUT_NAMES[k]} — failed, ${note}">${icon('retry')}${k}</span>`;
    return `<span class="pill ${s}" title="${OUT_NAMES[k]} — ${ST[s]}" aria-label="${OUT_NAMES[k]} — ${ST[s]}"><i></i>${k}</span>`;
  }).join('') + (rest > 0 ? `<span class="more" title="${c.outs.slice(maxOuts).map(o => OUT_NAMES[o[0]]).join(', ')}">+${rest}</span>` : '');
  return `<div class="strip ${frozenAll ? '' : (c.strip || '')}">
    <span class="in-chip ${chipCls}" title="${chipTitle}" aria-label="${chipTitle}">${chipText}</span>
    ${dense ? '' : `<span class="cam-no">CAM ${c.n}</span>`}
    <span class="cam-name" title="${c.name}">${c.name}</span>
    ${fx ? `<span class="fx">${fx}</span>` : ''}
    <span class="flow">${icon('arrow')}</span>
    <span class="outs">${outs}</span>
    ${c.seen && !frozenAll ? `<span class="seen" title="NDI output dropped for 3 s at 20:14 and recovered. Open the camera to clear this mark.">${icon('seen')}${c.seen}</span>` : ''}
  </div>`;
}
function tile(c, maxOuts, frozenAll, dense) {
  return `<div class="tile" tabindex="0" aria-label="CAM ${c.n} ${c.name}, open camera">
    <div class="pic">${scene(c.scene, { keyed: c.keyed, slate: c.slate })}</div>${strip(c, maxOuts, frozenAll, dense)}</div>`;
}

/* sizing: keep every tile 16:9 and the whole wall inside the work area */
const GRID = { 1: [1, 1], 2: [2, 1], 3: [2, 2], 4: [2, 2], 5: [3, 2], 6: [3, 2], 7: [4, 2], 8: [4, 2] };
function sizeWall() {
  document.querySelectorAll('.wall').forEach(w => {
    const n = +w.dataset.n, [cols, rows] = GRID[n], area = w.parentElement;
    const W = area.clientWidth - 4, H = area.clientHeight - 4, strip = 33, gap = 2;
    const byW = (W - gap * (cols - 1)) / cols;
    const byH = ((H - gap * (rows - 1)) / rows - strip) * 16 / 9;
    const tw = Math.floor(Math.min(byW, byH));
    w.style.gridTemplateColumns = `repeat(${cols}, ${tw}px)`;
  });
}

const bar = document.querySelector('.mockbar');
function show(id) {
  const s = SCREENS[id].build();
  document.getElementById('rail').innerHTML = RAIL(s.rail);
  document.getElementById('main').innerHTML = s.html;
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  sizeWall();
}
Object.entries(SCREENS).forEach(([id, s]) => {
  const b = document.createElement('button');
  b.role = 'tab'; b.dataset.id = id; b.textContent = s.label;
  b.onclick = () => show(id);
  bar.appendChild(b);
});
bar.insertAdjacentHTML('beforeend', '<span class="note">Pictures are synthetic. Camera and show names are user data.</span>');
addEventListener('resize', sizeWall);
show(SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'multiview');
</script>
