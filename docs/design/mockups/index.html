<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreadCamera Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #22D3EE; --cyan-hover: #67E8F9; --cyan-wash: rgba(34,211,238,0.13); --ink: #04191D;
  --plate: #08090B; --rail: #060709; --surface: #0E1013; --surface-hover: #13161B; --surface-raised: #16191F;
  --well: #050607;
  --hair: rgba(255,255,255,0.10); --hair-subtle: rgba(255,255,255,0.06); --hair-strong: rgba(255,255,255,0.18);
  --text: #F5F7FA; --muted: rgba(245,247,250,0.66); --dim: rgba(245,247,250,0.50); --disabled: rgba(245,247,250,0.34);
  --live: #EF4444; --live-t: #FF6B6B; --conn: #F59E0B; --conn-t: #FBBF24; --ready: #22C55E; --ready-t: #4ADE80;
  --off: rgba(245,247,250,0.30); --off-t: rgba(245,247,250,0.50);
  --danger: #FB7185; --warning: #FBBF24; --success: #4ADE80; --info: #38BDF8;
  --ui: 'Segoe UI Variable Text', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.2,0,0,1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: #000; color: var(--text); font: 400 12px/1.4 var(--ui); caret-color: var(--cyan); overflow: hidden; user-select: none; }
::selection { background: var(--cyan-wash); color: var(--text); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hair-strong); border-radius: 999px; border: 3px solid var(--surface); }
::-webkit-scrollbar-track { background: transparent; }
.mono, .num { font-family: var(--mono); font-feature-settings: 'tnum' 1, 'lnum' 1; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: -1px; }

/* mockup chrome, not part of the app */
.mockbar { height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: #000; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.mockbar::-webkit-scrollbar { display: none; }
.mockbar .tag { font: 500 10px var(--mono); letter-spacing: .1em; color: var(--dim); margin-right: 8px; }
.mockbar button { font: 400 12px var(--ui); color: var(--dim); background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
.mockbar button:hover { color: var(--text); }
.mockbar button[aria-selected="true"] { color: var(--text); border-color: var(--hair-strong); }
.mockbar .note { margin-left: auto; font-size: 11px; color: var(--disabled); padding-left: 16px; }

/* window */
.win { height: calc(100vh - 30px); display: grid; grid-template-rows: 32px 38px minmax(0, 1fr) 24px; background: var(--plate); border-top: 1px solid var(--hair); position: relative; }
.titlebar { display: flex; align-items: stretch; background: var(--rail); }
.app-ic { width: 40px; display: grid; place-items: center; color: var(--cyan); }
.menus { display: flex; align-items: stretch; }
.menus span { display: grid; place-items: center; padding: 0 9px; color: var(--muted); cursor: default; }
.menus span:hover, .menus span.open { background: var(--surface-hover); color: var(--text); }
.wintitle { flex: 1; display: grid; place-items: center; color: var(--dim); }
.caption { display: flex; }
.caption span { width: 46px; display: grid; place-items: center; color: var(--muted); }
.caption span:hover { background: var(--surface-hover); color: var(--text); }
.caption span.close:hover { background: #C42B1C; color: #fff; }
.caption svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1; fill: none; }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--hair); background: var(--plate); }
.ws { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--hair); border-radius: 6px; margin-right: 6px; }
.ws span { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; color: var(--muted); font-weight: 600; cursor: default; }
.ws span:hover { color: var(--text); }
.ws span.on { background: var(--cyan-wash); color: var(--cyan); }
.tb { height: 28px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; border: 1px solid transparent; background: none; color: var(--text); cursor: default; white-space: nowrap; }
.tb:hover { background: var(--surface-hover); border-color: var(--hair); }
.tb svg.i { color: var(--muted); }
.tb.accent svg.i { color: var(--cyan); }
.tb.danger { color: var(--danger); } .tb.danger svg.i { color: var(--danger); }
.tb.sm { height: 22px; padding: 0 6px; font-weight: 400; color: var(--muted); } .tb.sm svg.i { width: 12px; height: 12px; color: var(--cyan); }
.tsep { width: 1px; height: 20px; background: var(--hair); margin: 0 4px; }
.tspace { flex: 1; }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 1px 360px; min-height: 0; }
.splitter { background: var(--hair); position: relative; cursor: col-resize; }
.splitter::after { content: ''; position: absolute; inset: 0 -3px; }
.center { display: grid; grid-template-rows: 30px minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--well); }
.subbar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--hair-subtle); background: var(--plate); color: var(--dim); }
.subbar b { color: var(--text); font-weight: 600; }
.subbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; }
.seg span { height: 22px; padding: 0 8px; display: grid; place-items: center; color: var(--muted); border-left: 1px solid var(--hair); cursor: default; white-space: nowrap; }
.seg span:first-child { border-left: none; }
.seg span.on { background: var(--surface-raised); color: var(--text); }

/* multiview wall */
.wall-wrap { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.wall-area { flex: 1; min-height: 0; display: grid; place-items: center; padding: 4px; }
.wall { display: grid; gap: 3px; }
.tile { display: flex; flex-direction: column; background: var(--surface); min-width: 0; overflow: hidden; position: relative; cursor: default; }
.tile.sel { outline: 1px solid var(--cyan); outline-offset: 1px; }
.pic { aspect-ratio: 16 / 9; background: #000; overflow: hidden; position: relative; }
.pic svg { display: block; width: 100%; height: 100%; }
.strip { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 7px; border-top: 1px solid var(--hair); min-width: 0; }
.tile:hover .strip { background: var(--surface-hover); }
.strip.warn { box-shadow: inset 2px 0 0 var(--warning); background: rgba(251,191,36,0.08); }
.strip.err { box-shadow: inset 2px 0 0 var(--danger); background: rgba(251,113,133,0.08); }
.in-chip { height: 18px; min-width: 36px; padding: 0 5px; border-radius: 3px; display: inline-grid; place-items: center; font: 600 10.5px var(--mono); letter-spacing: .05em; color: var(--ink); flex: none; }
.in-chip.ready { background: var(--ready); } .in-chip.conn { background: var(--conn); }
.in-chip.err { background: var(--danger); color: #2A0A10; } .in-chip.off { background: var(--off); color: var(--text); }
.cam-no { font: 500 11px var(--mono); color: var(--dim); flex: none; }
.cam-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12.5px; }
.fx { display: flex; gap: 3px; color: var(--muted); flex: none; } .fx svg.i { width: 13px; height: 13px; } .fx .bad { color: var(--danger); }
.flow { color: var(--disabled); flex: none; } .flow svg.i { width: 12px; height: 12px; }
.outs { display: flex; gap: 3px; flex: none; }
.pill { height: 18px; padding: 0 6px 0 5px; border-radius: 999px; border: 1px solid; display: inline-flex; align-items: center; gap: 4px; font: 500 10.5px var(--mono); letter-spacing: .05em; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; }
.pill.live { color: var(--live-t); border-color: rgba(239,68,68,.55); } .pill.live i { background: var(--live); animation: pulse 2s ease-in-out infinite alternate; }
.pill.conn { color: var(--conn-t); border-color: rgba(245,158,11,.55); } .pill.conn i { background: var(--conn); }
.pill.ready { color: var(--ready-t); border-color: rgba(34,197,94,.55); } .pill.ready i { background: var(--ready); }
.pill.off { color: var(--off-t); border-color: var(--hair-strong); } .pill.off i { background: var(--off); }
.err-chip { height: 18px; padding: 0 5px; border-radius: 3px; border: 1px solid rgba(251,113,133,.6); background: rgba(251,113,133,.08); color: var(--danger); display: inline-flex; align-items: center; gap: 3px; font: 500 10.5px var(--mono); letter-spacing: .05em; }
.err-chip svg.i { width: 11px; height: 11px; }
.more { font: 500 10.5px var(--mono); color: var(--muted); }
.seen { display: inline-flex; align-items: center; gap: 3px; color: var(--info); font: 500 10.5px var(--mono); flex: none; } .seen svg.i { width: 11px; height: 11px; }
@keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.live i { animation: none; } }
.syn { position: absolute; right: 5px; top: 4px; font: 500 8.5px var(--mono); letter-spacing: .1em; color: rgba(255,255,255,.4); pointer-events: none; }

/* blocks */
.block { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-left: 2px solid; font-size: 12px; }
.block b { font-weight: 600; } .block .d { color: var(--muted); }
.block svg.i { width: 14px; height: 14px; margin-top: 1px; }
.block.warning { border-color: var(--warning); background: rgba(251,191,36,0.08); } .block.warning svg { color: var(--warning); }
.block.danger { border-color: var(--danger); background: rgba(251,113,133,0.08); } .block.danger svg { color: var(--danger); }

/* inspector */
.insp { background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.insp-h { padding: 8px 12px; border-bottom: 1px solid var(--hair); display: grid; gap: 3px; }
.insp-h .k { font: 500 10px var(--mono); letter-spacing: .1em; color: var(--dim); }
.insp-h .t { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.insp-h .t .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insp-b { overflow: auto; }
details.sec { border-bottom: 1px solid var(--hair); }
details.sec > summary { list-style: none; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; font-weight: 600; cursor: default; background: var(--plate); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .chev { color: var(--dim); display: grid; transition: transform .12s var(--ease); }
details.sec > summary .chev svg.i { width: 12px; height: 12px; }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec > summary .right { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--dim); font-weight: 400; }
.sec-b { padding: 8px 12px 10px; display: grid; gap: 6px; }
.ibtn { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); border: 1px solid transparent; background: none; cursor: default; }
.ibtn:hover { background: var(--surface-hover); border-color: var(--hair); color: var(--text); }
.ibtn svg.i { width: 14px; height: 14px; }
.prop { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 26px; }
.prop > label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl { height: 26px; border-radius: 4px; background: var(--plate); border: 1px solid var(--hair); display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; }
.ctl:hover { border-color: var(--hair-strong); }
.ctl.focus { border-color: var(--cyan); }
.ctl .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl .v.mono { font-size: 11.5px; }
.ctl .u { color: var(--dim); font: 400 11px var(--mono); }
.ctl svg.i { width: 12px; height: 12px; color: var(--dim); }
.spin { display: grid; margin-right: -4px; }
.spin svg.i { width: 10px; height: 8px; }
.ro { font: 400 11.5px var(--mono); color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.row2 .prop { grid-template-columns: 44px minmax(0, 1fr); }
.sw { width: 28px; height: 16px; border-radius: 999px; background: var(--hair-strong); position: relative; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
.sw.on { background: var(--cyan); } .sw.on::after { left: 14px; background: var(--ink); }
.slider { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; }
.track { height: 3px; border-radius: 2px; background: var(--hair-strong); position: relative; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: rgba(245,247,250,.6); border-radius: 2px; }
.track .knob { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--text); transform: translate(-50%, -50%); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.sv { height: 22px; border: 1px solid var(--hair); border-radius: 4px; background: var(--plate); display: grid; place-items: center end; padding: 0 6px; font: 400 11px var(--mono); }
.group { border: 1px solid var(--hair); border-radius: 4px; background: var(--plate); }
.group-h { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; border-bottom: 1px solid var(--hair-subtle); }
.group-h .gi { color: var(--muted); display: grid; } .group-h .gi svg.i { width: 14px; height: 14px; }
.group-h b { font-weight: 600; }
.group-h .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.group-b { padding: 6px 8px 8px; display: grid; gap: 6px; }
.group .prop { grid-template-columns: 88px minmax(0, 1fr); }
.group .ctl { background: var(--surface); }
.st { font: 500 10px var(--mono); letter-spacing: .08em; padding: 1px 5px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
.st.run { color: var(--success); border-color: rgba(74,222,128,.35); }
.chain { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; color: var(--disabled); }
.chain span { color: var(--muted); padding: 1px 6px; border: 1px solid var(--hair); border-radius: 3px; }
.chain span.fxn { color: var(--text); border-color: var(--hair-strong); }
.chain svg.i { width: 10px; height: 10px; }
.note { color: var(--dim); font-size: 11.5px; }
.orow { display: grid; grid-template-columns: auto minmax(0, 1fr) 24px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--hair-subtle); }
.orow:last-child { border-bottom: none; }
.orow .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .m { font: 400 11px var(--mono); color: var(--dim); }
.btn { height: 26px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--hair-strong); background: var(--surface-raised); color: var(--text); display: inline-flex; align-items: center; gap: 6px; cursor: default; white-space: nowrap; }
.btn:hover { background: var(--surface-hover); }
.btn svg.i { width: 14px; height: 14px; color: var(--muted); }
.btn.primary { background: var(--cyan); border-color: var(--cyan); color: var(--ink); font-weight: 600; } .btn.primary svg.i { color: var(--ink); }
.btn.primary:hover { background: var(--cyan-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #2A0A10; font-weight: 600; } .btn.danger svg.i { color: #2A0A10; }
.btn.ghost-danger { background: none; border-color: transparent; color: var(--danger); padding: 0 4px; } .btn.ghost-danger svg.i { color: var(--danger); }
.btn.wide { width: 100%; justify-content: center; height: 30px; }

/* empty */
.empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); }
.empty > div { display: grid; gap: 6px; justify-items: center; max-width: 360px; }
.empty .frame { width: 140px; aspect-ratio: 16/9; border: 1px dashed var(--hair-strong); border-radius: 4px; display: grid; place-items: center; color: var(--dim); margin-bottom: 6px; }
.empty .h { color: var(--text); font-size: 14px; font-weight: 600; }

/* status bar */
.status { display: flex; align-items: center; background: var(--rail); border-top: 1px solid var(--hair); font: 400 11px var(--mono); color: var(--dim); min-width: 0; overflow: hidden; }
.status > span { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%; border-right: 1px solid var(--hair-subtle); white-space: nowrap; }
.status > span.r { margin-left: auto; border-left: 1px solid var(--hair-subtle); }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ready); }
.status .dot.warn { background: var(--warning); }
.status .w { color: var(--warning); } .status .e { color: var(--danger); }
.status svg.i { width: 12px; height: 12px; }
.status b { color: var(--muted); font-weight: 500; }

/* calibration */
.cal { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; height: 100%; }
.cal-list { border-right: 1px solid var(--hair); background: var(--surface); overflow: auto; }
.cal-list .hd { height: 28px; display: flex; align-items: center; padding: 0 10px; color: var(--dim); border-bottom: 1px solid var(--hair-subtle); }
.cal-cam { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; padding: 6px 10px; align-items: center; border-bottom: 1px solid var(--hair-subtle); cursor: default; }
.cal-cam:hover { background: var(--surface-hover); }
.cal-cam.on { background: var(--cyan-wash); box-shadow: inset 2px 0 0 var(--cyan); }
.cal-cam .th { aspect-ratio: 16/9; border-radius: 2px; overflow: hidden; } .cal-cam .th svg { display: block; width: 100%; height: 100%; }
.cal-cam .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-cam .s { font: 400 11px var(--mono); color: var(--dim); white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.cal-cam .s.ok { color: var(--success); } .cal-cam .s svg.i { width: 11px; height: 11px; }
.cal-view { display: grid; place-items: center; padding: 10px; min-height: 0; min-width: 0; }
.cal-view .pic { height: 100%; max-width: 100%; border-radius: 2px; }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.swatch { display: grid; grid-template-rows: 1fr 1fr; aspect-ratio: 1; border-radius: 2px; overflow: hidden; }
.swatch i { display: block; }
.de { display: flex; align-items: baseline; gap: 8px; }
.de .v { font: 500 22px var(--mono); }
.steps { padding-left: 18px; display: grid; gap: 5px; color: var(--muted); }
.steps li.done { color: var(--dim); } .steps li.done::marker { color: var(--success); } .steps li.now { color: var(--text); }
.link { background: none; border: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--hair-strong); cursor: default; padding: 0; }

.solo-bar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--cyan-wash); color: var(--muted); border-bottom: 1px solid var(--hair-subtle); }
.solo-bar svg.i { width: 14px; height: 14px; color: var(--cyan); }
.solo-bar b { color: var(--text); font-weight: 600; }
.solo-bar .right { margin-left: auto; color: var(--dim); }
.wall-wrap > .cal-view { flex: 1; }
.block.info { border-color: var(--info); background: rgba(56,189,248,0.08); } .block.info svg { color: var(--info); }
.ok-line { display: inline-flex; align-items: center; gap: 5px; color: var(--success); }
.ok-line svg.i { width: 12px; height: 12px; }

/* menu */
.menu { position: absolute; z-index: 20; min-width: 260px; background: var(--surface-raised); border: 1px solid var(--hair-strong); border-radius: 6px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4); }
.menu .it { height: 28px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; padding: 0 10px 0 6px; border-radius: 4px; }
.menu .it:hover, .menu .it.hl { background: var(--surface-hover); }
.menu .it svg.i { width: 14px; height: 14px; color: var(--muted); }
.menu .it .k { font: 400 11px var(--mono); color: var(--dim); }
.menu .it.danger { color: var(--danger); } .menu .it.danger svg.i { color: var(--danger); }
.menu hr { border: none; border-top: 1px solid var(--hair); margin: 4px 2px; }

/* dialogs */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; z-index: 30; }
.dlg { width: 480px; max-width: calc(100% - 32px); background: var(--surface-raised); border: 1px solid var(--hair-strong); border-radius: 6px; box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4); overflow: hidden; }
.dlg-h { height: 36px; display: flex; align-items: center; padding: 0 4px 0 14px; font-weight: 600; font-size: 13px; }
.dlg-h .x { margin-left: auto; width: 32px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 4px; }
.dlg-h .x:hover { background: #C42B1C; color: #fff; }
.dlg-h .x svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1; fill: none; }
.dlg-b { padding: 6px 14px 14px; display: grid; gap: 8px; color: var(--muted); }
.dlg-b p strong { color: var(--text); font-weight: 600; }
.dlg-b .prop { grid-template-columns: 120px minmax(0, 1fr); }
.dlg-f { display: flex; justify-content: flex-end; gap: 6px; padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--hair); }
.dlg-f .btn { min-width: 84px; justify-content: center; }
.pick { display: grid; gap: 4px; }
.pick-row { display: grid; grid-template-columns: 16px 24px 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--hair); border-radius: 4px; background: var(--surface); color: var(--text); }
.pick-row.sel { border-color: var(--cyan); background: var(--cyan-wash); }
.pick-row.done { opacity: .5; }
.pick-row .rd { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--hair-strong); margin-top: 2px; display: grid; place-items: center; }
.pick-row.sel .rd { border-color: var(--cyan); } .pick-row.sel .rd::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
.pick-row .ic { color: var(--muted); } .pick-row .ic svg.i { width: 18px; height: 18px; }
.pick-row b { font-weight: 600; display: block; }
.pick-row p { color: var(--muted); margin-top: 1px; }
.pick-row .req { font: 400 11px var(--mono); color: var(--dim); margin-top: 4px; display: flex; gap: 4px; align-items: center; }
.pick-row .req svg.i { width: 11px; height: 11px; color: var(--success); }
.tag2 { font: 500 10px var(--mono); letter-spacing: .06em; color: var(--dim); border: 1px solid var(--hair); border-radius: 3px; padding: 1px 5px; }
.settings-dlg { width: 680px; }
.settings-dlg .wrap { display: grid; grid-template-columns: 150px 1fr; min-height: 340px; }
.cats { background: var(--surface); border-right: 1px solid var(--hair); padding: 6px; display: grid; align-content: start; gap: 2px; }
.cats span { height: 28px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; color: var(--muted); }
.cats span.on { background: var(--cyan-wash); color: var(--cyan); font-weight: 600; }
.settings-dlg .pane { padding: 12px 16px; display: grid; gap: 8px; align-content: start; color: var(--muted); }
.settings-dlg .pane h3 { font-size: 12px; font-weight: 600; color: var(--text); padding-bottom: 2px; }
.settings-dlg .pane .prop { grid-template-columns: 170px minmax(0, 1fr); }
.slate-th { width: 120px; aspect-ratio: 16/9; border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; } .slate-th svg { display: block; width: 100%; height: 100%; }
</style>

<body>
<nav class="mockbar" role="tablist" aria-label="Mockup screens"><span class="tag">MOCKUP</span></nav>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#141414"/><rect width="8" height="8" fill="#1F1F1F"/><rect x="8" y="8" width="8" height="8" fill="#1F1F1F"/></pattern></defs>
</svg>

<script>
const I = {
  matte: '<path d="M8 8.2a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Z"/><path d="M3.5 13.5c.6-2.3 2.3-3.6 4.5-3.6s3.9 1.3 4.5 3.6"/><path d="M1.5 4V2.5a1 1 0 0 1 1-1H4M12 1.5h1.5a1 1 0 0 1 1 1V4M14.5 12v1.5a1 1 0 0 1-1 1H12M4 14.5H2.5a1 1 0 0 1-1-1V12"/>',
  bg: '<rect x="1.5" y="3" width="13" height="10" rx="1.5"/><circle cx="5.5" cy="6.5" r="1.2"/><path d="m14.5 10.5-3.5-3.5-6 6"/>',
  color: '<circle cx="8" cy="8" r="6.5"/><path d="M8 1.5v13"/><path d="M8 4.5h4.6M8 8h6.5M8 11.5h4.6"/>',
  arrow: '<path d="M2.5 8h11M9.5 4l4 4-4 4"/>',
  seen: '<path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v2.8h2.8"/><path d="M8 5v3.2l2 1.3"/>',
  grid: '<rect x="1.5" y="2.5" width="5.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="5.5" height="4.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="4.5" rx="1"/><rect x="9" y="9" width="5.5" height="4.5" rx="1"/>',
  chart: '<rect x="1.5" y="3" width="13" height="10" rx="1"/><path d="M5.8 3v10M10.2 3v10M1.5 8h13"/>',
  settings: '<path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  chev: '<path d="m6 4 4 4-4 4"/>',
  down: '<path d="m4.5 6.5 3.5 3.5 3.5-3.5"/>',
  up: '<path d="m4.5 9.5 3.5-3.5 3.5 3.5"/>',
  warn: '<path d="M8 2 1.5 13.5h13L8 2Z"/><path d="M8 6.5v3M8 11.6v.1"/>',
  err: '<circle cx="8" cy="8" r="6.5"/><path d="M8 4.8v3.6M8 10.9v.1"/>',
  retry: '<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v2.8h-2.8"/>',
  check: '<path d="m3.5 8.5 3 3 6-7"/>',
  cam: '<rect x="1.5" y="4" width="9.5" height="8" rx="1.5"/><path d="m11 7 3.5-2v6L11 9"/>',
  out: '<path d="M9 2.5h4.5V7"/><path d="M13.5 2.5 7.5 8.5"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/>',
  fxadd: '<path d="M8 1.5 9.4 5l3.6.4-2.7 2.4.8 3.6L8 9.6l-3.1 1.8.8-3.6L3 5.4 6.6 5 8 1.5Z"/>',
  more: '<circle cx="3.5" cy="8" r=".7"/><circle cx="8" cy="8" r=".7"/><circle cx="12.5" cy="8" r=".7"/>',
  undo: '<path d="M5 3.5 2 6.5l3 3"/><path d="M2 6.5h7.5a4 4 0 0 1 0 8H7"/>',
  power: '<path d="M8 1.5v6"/><path d="M4.4 4a5.5 5.5 0 1 0 7.2 0"/>',
  trash: '<path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/>'
};
const icon = (n) => `<svg class="i" viewBox="0 0 16 16" aria-hidden="true">${I[n]}</svg>`;
const CAP = { min: '<svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg>', max: '<svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg>', close: '<svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10"/></svg>' };

/* Synthetic camera pictures */
const SCENES = {
  stageL: { wall: '#1b2440', floor: '#121620', led: '#2d4a8a', skin: '#c99b7e', shirt: '#2a2f3a', x: 64 },
  mc: { wall: '#3a2c22', floor: '#1d1712', led: '#7a5636', skin: '#d4a684', shirt: '#6b1f2a', x: 86 },
  guest: { wall: '#22322c', floor: '#141b18', led: '#3f6b58', skin: '#b98a6a', shirt: '#d8d4cc', x: 78 },
  wide: { wall: '#151a24', floor: '#0e1118', led: '#3b4f7a', skin: '#c49579', shirt: '#1e2a44', x: 40, crowd: true },
  podium: { wall: '#2a2a30', floor: '#16161a', led: '#55505e', skin: '#cfa182', shirt: '#24364d', x: 80, podium: true },
  back: { wall: '#2b2620', floor: '#18150f', led: '#5d4a2c', skin: '#b78868', shirt: '#3c3c3c', x: 70 },
  webcam: { wall: '#1e1e22', floor: '#141416', led: '#333338', skin: '#c19272', shirt: '#4a4f57', x: 80, close: true },
  hanoi: { wall: '#26302a', floor: '#141a16', led: '#47604f', skin: '#c79a7c', shirt: '#30353f', x: 80 }
};
const CHART = ['#735244','#c29682','#627a9d','#576c43','#8580b1','#67bdaa','#d67e2c','#505ba6','#c15a63','#5e3c6c','#9dbc40','#e0a32e',
  '#383d96','#469449','#af363c','#e7c71f','#bb5695','#0885a1','#f3f3f2','#c8c8c8','#a0a0a0','#7a7a79','#555555','#343434'];
const shift = (hex, d) => '#' + [1, 3, 5].map((o, i) => Math.max(0, Math.min(255, parseInt(hex.slice(o, o + 2), 16) + d[i])).toString(16).padStart(2, '0')).join('');
const SEEN = CHART.map(h => shift(h, [22, 8, -18]));
function chartSvg(handles) {
  const x0 = 52, y0 = 40, w = 56, h = 36, cw = w / 6, ch = h / 4;
  let g = `<rect x="${x0 - 2}" y="${y0 - 2}" width="${w + 4}" height="${h + 4}" rx="1" fill="#141414"/>`;
  CHART.forEach((c, i) => { const cx = x0 + (i % 6) * cw, cy = y0 + Math.floor(i / 6) * ch;
    g += `<rect x="${cx + .7}" y="${cy + .7}" width="${cw - 1.4}" height="${ch - 1.4}" rx=".4" fill="${SEEN[i]}"/>`;
    if (handles) g += `<rect x="${cx + cw / 2 - 1.6}" y="${cy + ch / 2 - 1.6}" width="3.2" height="3.2" fill="none" stroke="#F5F7FA" stroke-width=".35"/>`; });
  if (handles) {
    g += `<rect x="${x0 - 2}" y="${y0 - 2}" width="${w + 4}" height="${h + 4}" fill="none" stroke="#22D3EE" stroke-width=".45"/>`;
    [[x0 - 2, y0 - 2], [x0 + w + 2, y0 - 2], [x0 - 2, y0 + h + 2], [x0 + w + 2, y0 + h + 2]].forEach(([x, y]) => g += `<circle cx="${x}" cy="${y}" r="1.9" fill="#08090B" stroke="#22D3EE" stroke-width=".6"/>`);
  }
  return `<g transform="rotate(-3 80 58)">${g}</g>`;
}
function scene(key, o = {}) {
  const s = SCENES[key];
  const tag = o.noTag ? '' : '<span class="syn">SYNTHETIC</span>';
  if (o.slate) return `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Slate"><rect width="160" height="90" fill="#0b0d12"/><rect x="40" y="36" width="80" height="1" fill="#22D3EE" opacity=".7"/><text x="80" y="31" text-anchor="middle" font-family="Segoe UI" font-weight="600" font-size="8" fill="#F5F7FA">We'll be right back</text><text x="80" y="48" text-anchor="middle" font-family="JetBrains Mono" font-size="4.5" fill="rgba(245,247,250,.55)">BREADCAMERA · SLATE</text></svg>${tag}`;
  const bg = o.keyed ? `<rect width="160" height="90" fill="url(#checker)"/>` :
    `<rect width="160" height="90" fill="${s.wall}"/><rect x="14" y="10" width="54" height="30" fill="${s.led}" opacity=".55"/><rect x="92" y="10" width="54" height="30" fill="${s.led}" opacity=".4"/><rect y="62" width="160" height="28" fill="${s.floor}"/>` +
    (s.crowd ? Array.from({ length: 18 }, (_, i) => `<circle cx="${6 + i * 9}" cy="${80 + (i % 2) * 3}" r="4.2" fill="#0a0c10"/>`).join('') : '');
  const sc = s.close ? 1.7 : s.crowd ? .7 : 1, top = s.close ? 26 : s.crowd ? 44 : 30;
  const person = `<g transform="translate(${s.x} ${top}) scale(${sc})"><path d="M-15 46 C-15 30 -9 25 0 25 C9 25 15 30 15 46 Z" fill="${s.shirt}"/><rect x="-3" y="18" width="6" height="8" fill="${s.skin}"/><ellipse cx="0" cy="11" rx="7.2" ry="8.6" fill="${s.skin}"/><path d="M-7.4 9 C-7 1.5 7 1.5 7.4 9 C5 5.5 -5 5.5 -7.4 9 Z" fill="#1a1410"/></g>`;
  const pod = s.podium ? `<rect x="62" y="60" width="36" height="30" fill="#1d2633"/>` : '';
  return `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Synthetic camera picture">${bg}${person}${pod}${o.chart ? chartSvg(o.handles) : ''}</svg>${tag}`;
}

/* Data */
const OUT_NAMES = { NDI: 'NDI output', SRT: 'SRT output', SDI: 'SDI output', VCAM: 'Virtual camera', FS: 'Fullscreen', OMT: 'OMT output' };
const IN_NAMES = { SRT: 'SRT input', NDI: 'NDI input', SDI: 'DeckLink input', USB: 'USB input', AJA: 'AJA input' };
const ST = { live: 'Live', conn: 'Connecting', ready: 'Ready', off: 'Offline' };
const CAMS = [
  { n: 1, name: 'Sân khấu trái', scene: 'stageL', in: 'SRT', st: 'ready', deg: '2.1% packet loss, 14 dropped frames in the last minute', fx: ['on','on','on'], outs: [['NDI','live'],['SDI','live']] },
  { n: 2, name: 'MC chính – Cam 2', scene: 'mc', in: 'SRT', st: 'ready', fx: ['on','on','off'], outs: [['NDI','live'],['SRT','err','retry 3s']] },
  { n: 3, name: 'Khách mời Đà Nẵng', scene: 'guest', in: 'NDI', st: 'conn', hold: '00:04', fx: ['on','on','on'], outs: [['NDI','live']], strip: 'err' },
  { n: 4, name: 'Toàn cảnh hội trường', scene: 'wide', in: 'SDI', st: 'ready', keyed: true, fx: ['on','on','on'], outs: [['NDI','live'],['OMT','live'],['VCAM','live'],['FS','live']], seen: '20:14' },
  { n: 5, name: 'Bục phát biểu', scene: 'podium', in: 'USB', st: 'ready', fx: ['on','on','off'], outs: [['VCAM','live']] },
  { n: 6, name: 'Hậu trường', scene: 'back', in: 'SDI', st: 'ready', fx: ['on','bad','on'], outs: [['NDI','live']] },
  { n: 7, name: 'Webcam đạo diễn', scene: 'webcam', in: 'USB', st: 'off', fx: ['on','off','off'], outs: [['NDI','off']] },
  { n: 8, name: 'Cầu nối Hà Nội', scene: 'hanoi', in: 'SRT', st: 'conn', slate: true, fx: ['on','on','on'], outs: [['NDI','live']], strip: 'err' }
];
const FX = [['color', 'Colour'], ['matte', 'Background removal'], ['bg', 'Background']];
const FXSTATE = { on: 'running', off: 'not added', bad: 'bypassed after an error' };

function strip(c, maxOuts, frozen, dense) {
  const st = frozen ? 'off' : c.st;
  const chipCls = frozen ? 'off' : (c.slate || c.hold) ? 'err' : c.deg ? 'conn' : st;
  const chipText = c.slate ? 'SLATE' : (c.hold || c.in);
  const chipTitle = c.slate ? `${IN_NAMES[c.in]}: signal down, showing the slate` : c.hold ? `${IN_NAMES[c.in]}: signal down, holding the last frame (${c.hold} left)` : c.deg ? `${IN_NAMES[c.in]}: degraded, ${c.deg}` : `${IN_NAMES[c.in]}: ${st === 'ready' ? 'receiving' : ST[st]}`;
  const fx = FX.map(([k, label], i) => (c.fx[i] === 'off' || (dense && c.fx[i] === 'on')) ? '' : `<span class="${c.fx[i] === 'bad' ? 'bad' : ''}" title="${label}: ${FXSTATE[c.fx[i]]}">${icon(k)}</span>`).join('');
  const shown = c.outs.slice(0, maxOuts), rest = c.outs.length - shown.length;
  const outs = shown.map(([k, s, note]) => {
    if (frozen) s = 'off';
    if (s === 'err') return `<span class="err-chip" title="${OUT_NAMES[k]}: failed, ${note}">${icon('retry')}${k}</span>`;
    return `<span class="pill ${s}" title="${OUT_NAMES[k]}: ${ST[s]}"><i></i>${k}</span>`;
  }).join('') + (rest > 0 ? `<span class="more">+${rest}</span>` : '');
  return `<div class="strip ${frozen ? '' : (c.strip || '')}">
    <span class="in-chip ${chipCls}" title="${chipTitle}">${chipText}</span>
    ${dense ? '' : `<span class="cam-no">CAM ${c.n}</span>`}
    <span class="cam-name" title="${c.name}">${c.name}</span>
    ${fx ? `<span class="fx">${fx}</span>` : ''}
    <span class="flow">${icon('arrow')}</span><span class="outs">${outs}</span>
    ${c.seen && !frozen ? `<span class="seen" title="NDI output dropped for 3 s at 20:14 and recovered. Select the camera to clear.">${icon('seen')}${c.seen}</span>` : ''}
  </div>`;
}
const tile = (c, o) => `<div class="tile ${c.n === 2 ? 'sel' : ''}" tabindex="0" aria-label="CAM ${c.n} ${c.name}"><div class="pic">${scene(c.scene, { keyed: c.keyed, slate: c.slate })}</div>${strip(c, o.dense ? 2 : 4, o.frozen, o.dense)}</div>`;

/* Window parts */
const MENUS = ['File', 'Show', 'Camera', 'Output', 'View', 'Help'];
const titlebar = (open) => `<div class="titlebar"><span class="app-ic">${icon('cam')}</span><div class="menus">${MENUS.map(m => `<span class="${m === open ? 'open' : ''}">${m}</span>`).join('')}</div>
  <div class="wintitle">Hội nghị Khách hàng 2026 — BreadCamera</div><div class="caption"><span title="Minimise">${CAP.min}</span><span title="Maximise">${CAP.max}</span><span class="close" title="Close to tray: outputs keep running">${CAP.close}</span></div></div>`;
const toolbar = (ws) => `<div class="toolbar">
  <button class="tb accent" title="Add camera (Ctrl+Shift+N)">${icon('plus')}Add camera</button>
  <span class="tspace"></span>
  <button class="tb" title="Settings (Ctrl+,)">${icon('settings')}Settings</button>
  <span class="tsep"></span>
  <button class="tb danger" title="Stop every output in this show">${icon('power')}Stop all outputs…</button></div>`;
const statusbar = (o = {}) => `<div class="status">
  <span><i class="dot ${o.restart ? 'warn' : ''}"></i>${o.restart ? '<span class="w">Engine restarting…</span>' : 'Engine <b>running 2:14:07</b>'}</span>
  <span><b>59.94</b> fps · <b>1920×1080</b></span>
  <span>GPU <b>61%</b> · RTX 4070 · Maxine</span>
  <span class="${o.overruns ? 'w' : ''}">${o.overruns ? `${icon('warn')}3 tick overruns / min` : 'Ticks on time'}</span>
  <span class="r">Outputs <b>${o.outs || '8 live'}</b>${o.retry === false ? '' : ' · <span class="e">1 retrying</span>'}</span>
  <span>Show saved 20:41</span></div>`;

/* Inspector */
const prop = (label, c) => `<div class="prop"><label>${label}</label>${c}</div>`;
const ctl = (v, o = {}) => `<div class="ctl ${o.focus ? 'focus' : ''}"><span class="v ${o.mono ? 'mono' : ''}">${v}</span>${o.unit ? `<span class="u">${o.unit}</span>` : ''}${o.select ? icon('down') : ''}${o.spin ? `<span class="spin">${icon('up')}${icon('down')}</span>` : ''}</div>`;
const slider = (pct, val) => `<div class="slider"><div class="track"><span class="fill" style="width:${pct}%"></span><span class="knob" style="left:${pct}%"></span></div><span class="sv">${val}</span></div>`;
const seg = (opts, on = 0) => `<div class="seg" style="width:max-content">${opts.map((o, i) => `<span class="${i === on ? 'on' : ''}">${o}</span>`).join('')}</div>`;
const sec = (title, body, right = '') => `<details class="sec" open><summary><span class="chev">${icon('chev')}</span>${title}<span class="right">${right}</span></summary><div class="sec-b">${body}</div></details>`;
const group = (ic, name, body) => `<div class="group"><div class="group-h"><span class="gi">${icon(ic)}</span><b>${name}</b><span class="right"><span class="st run">RUNNING</span><span class="sw on" role="switch" aria-checked="true" aria-label="${name} on"></span><button class="ibtn" aria-label="${name} menu">${icon('more')}</button></span></div><div class="group-b">${body}</div></div>`;

function inspector(o = {}) {
  return `<aside class="insp"><div class="insp-h"><span class="k">INSPECTOR · CAM 2</span><div class="t"><span class="in-chip ready">SRT</span><span class="n">MC chính – Cam 2</span></div></div>
  <div class="insp-b">
  ${sec('Input', `
    ${prop('Type', ctl('SRT', { select: true }))}
    ${prop('Mode', seg(['Caller', 'Listener']))}
    ${prop('URL', ctl('srt://203.0.113.24:9001?streamid=feed-2', { mono: true }))}
    ${prop('Latency', ctl('120', { mono: true, unit: 'ms', spin: true }))}
    ${prop('Passphrase', ctl('••••••••••••'))}
    ${prop('Receiving', '<span class="ro">8.4 Mb/s · H.264 · 1080p59.94</span>')}
    ${prop('Dropped · RTT', '<span class="ro">0 frames · 34 ms</span>')}`, '<span class="pill ready"><i></i>READY</span>')}
  ${sec('Effects', `
    <div class="chain"><span>SRT in</span>${icon('arrow')}<span class="fxn">Colour</span>${icon('arrow')}<span class="fxn">Background removal</span>${icon('arrow')}<span>2 outputs</span></div>
    ${o.calibrating ? group('color', 'Colour', `
      <div class="block info" role="status">${icon('chart')}<div><b>Calibrating.</b> <span class="d">Hold the chart in front of CAM 2 under show lighting.</span></div></div>
      ${prop('Chart', seg(['Printed card', 'Tablet']))}
      ${prop('Found', '<span class="ok-line">' + icon('check') + 'Chart found, corners placed</span>')}
      <div style="display:flex;gap:6px"><button class="btn primary">${icon('check')}Capture</button><button class="btn">Cancel</button></div>
      <p class="note">Drag a corner on the picture only if it is wrong. Tablet: show the chart image at full brightness.</p>`)
    : group('color', 'Colour', `${prop('Calibration', '<span class="ok-line" title="Average colour error 7.4 before, 1.1 after (ΔE2000)">' + icon('check') + 'Good match · 19:40</span>')}<div><button class="btn">${icon('chart')}Calibrate again</button></div>`)}
    ${group('matte', 'Background removal', `${prop('Quality', ctl('High quality', { select: true }))}<div class="row2">${prop('Choke', ctl('1', { mono: true, unit: 'px', spin: true }))}${prop('Feather', ctl('2', { mono: true, unit: 'px', spin: true }))}</div>${prop('Threshold', slider(42, '0.42'))}`)}
    <p class="note">Effects run in this fixed order.</p>`, `<button class="tb sm" title="Add effect to this camera">${icon('plus')}Add effect</button>`)}
  ${sec('Outputs', `
    <div class="block danger" role="alert">${icon('err')}<div><b>SRT output failed.</b> <span class="d">10.0.0.5:9000 refused the connection. Retrying in 3 s (attempt 4).</span></div></div>
    <div class="orow"><span class="pill live"><i></i>NDI</span><div><div class="n">BreadCamera (MC chính – Cam 2)</div><div class="m">Keyed · same as show</div></div><button class="ibtn" aria-label="Output menu">${icon('more')}</button></div>
    <div class="orow"><span class="err-chip">${icon('retry')}SRT</span><div><div class="n mono" style="font-size:11.5px">srt://10.0.0.5:9000</div><div class="m">Composited · 1280×720 · 29.97</div></div><button class="ibtn" aria-label="Output menu">${icon('more')}</button></div>`, `<button class="tb sm" title="Add output to this camera">${icon('plus')}Add output</button>`)}
  <div style="padding:10px 12px"><button class="btn ghost-danger">${icon('trash')}Remove camera…</button></div>
  </div></aside>`;
}
const emptyInspector = () => `<aside class="insp"><div class="insp-h"><span class="k">INSPECTOR</span><div class="t"><span class="n" style="color:var(--dim)">No camera selected</span></div></div><div class="insp-b"><p class="note" style="padding:12px">Select a camera in Multiview to edit its input, effects and outputs.</p></div></aside>`;

const GRID = { 1: [1, 1], 2: [2, 1], 3: [2, 2], 4: [2, 2], 5: [3, 2], 6: [3, 2], 7: [4, 2], 8: [4, 2] };
function multiviewWin(cams, o = {}) {
  const center = o.calibrating ? `<div class="wall-wrap"><div class="solo-bar">${icon('chart')}<b>CAM 2 · MC chính – Cam 2</b><span>Calibrating colour</span><span class="right">Other cameras keep running</span></div><div class="cal-view"><div class="pic">${scene('mc', { chart: true, handles: true })}</div></div></div>`
    : cams.length ? `<div class="wall-wrap">${o.banner || ''}<div class="wall-area"><div class="wall" data-n="${cams.length}">${cams.map(c => tile(c, { dense: cams.length > 4, frozen: o.frozen })).join('')}</div></div></div>`
    : `<div class="empty"><div><div class="frame">${icon('cam')}</div><span class="h">No cameras yet</span><span>Use Add camera in the toolbar (Ctrl+Shift+N). Each camera can send to several outputs.</span></div></div>`;
  return titlebar(o.menu) + toolbar('mv') + `<div class="body"><div class="center">
    <div class="subbar"><b>Multiview</b><span>${o.calibrating ? 'Showing CAM 2 only' : cams.length + ' cameras'}</span><span class="right">Layout ${seg(['Auto', '2×2', '3×2', '4×2'])}</span></div>${center}</div>
    <div class="splitter" title="Drag to resize"></div>${cams.length ? inspector(o) : emptyInspector()}</div>` + statusbar(o.status);
}

const dlg = (title, body, foot, cls = '') => `<div class="scrim"><div class="dlg ${cls}" role="dialog" aria-label="${title}"><div class="dlg-h">${title}<span class="x" title="Close">${CAP.close}</span></div>${body}<div class="dlg-f">${foot}</div></div></div>`;
const CAMS4 = CAMS.slice(0, 4);

const SCREENS = {
  multiview: { label: 'Multiview', build: () => multiviewWin(CAMS4) },
  eight: { label: '8 cameras', build: () => multiviewWin(CAMS, { status: { overruns: true, outs: '11 live' } }) },
  empty: { label: 'Empty', build: () => multiviewWin([], { status: { outs: '0', retry: false } }) },
  restart: { label: 'Engine restarting', build: () => multiviewWin(CAMS4, { frozen: true, status: { restart: true, outs: '0', retry: false },
    banner: `<div class="block warning" role="status">${icon('retry')}<div><b>Engine restarting.</b> <span class="d">It stopped unexpectedly and is reloading this show. Outputs come back in about 3 seconds. The pictures are the last frames received.</span></div></div>` }) },
  calibrate: { label: 'Calibrate colour', build: () => multiviewWin(CAMS4, { calibrating: true }) },
  menu: { label: 'Camera menu', build: () => multiviewWin(CAMS4, { menu: 'Camera' }) + `<div class="menu" style="left:150px;top:32px">
    <div class="it">${icon('plus')}<span>Add camera…</span><span class="k">Ctrl+Shift+N</span></div>
    <div class="it hl">${icon('out')}<span>Add output…</span><span class="k">Ctrl+Shift+O</span></div>
    <div class="it">${icon('fxadd')}<span>Add effect…</span><span class="k"></span></div><hr>
    <div class="it">${icon('chart')}<span>Calibrate colour…</span><span class="k">Ctrl+K</span></div>
    <div class="it">${icon('retry')}<span>Restart input</span><span class="k"></span></div><hr>
    <div class="it danger">${icon('trash')}<span>Remove camera…</span><span class="k">Del</span></div></div>` },
  settings: { label: 'Settings', build: () => multiviewWin(CAMS4) + dlg('Settings', `<div class="wrap"><div class="cats"><span class="on">Show</span><span>Engine</span><span>About</span></div>
    <div class="pane"><h3>Show format</h3>
      ${prop('Frame rate', ctl('59.94', { select: true, mono: true }))}
      ${prop('Resolution', ctl('1920×1080', { select: true, mono: true }))}
      <p class="note">Every camera is processed at this format. Each output can send a smaller size or half the frame rate.</p>
      <h3 style="margin-top:8px">Signal loss</h3>
      ${prop('Hold the last frame', ctl('5', { mono: true, unit: 's', spin: true }))}
      ${prop('Slate image', ctl('Built-in slate', { mono: true }))}
      <div class="prop"><span></span><div class="slate-th">${scene('hanoi', { slate: true, noTag: true })}</div></div></div></div>`,
    `<button class="btn">Cancel</button><button class="btn primary">Save</button>`, 'settings-dlg') },
  rate: { label: 'Change frame rate', build: () => multiviewWin(CAMS4) + dlg('Change the frame rate?', `<div class="dlg-b"><p>From <strong class="num">59.94</strong> to <strong class="num">50</strong> fps. Every output restarts and loses picture for about 1 second.</p></div>`,
    `<button class="btn">Cancel</button><button class="btn primary">Change frame rate</button>`) },
  addcam: { label: 'Add camera', build: () => multiviewWin(CAMS4) + dlg('Add camera', `<div class="dlg-b">
      ${prop('Name', ctl('Khách mời Đà Nẵng', { focus: true }))}
      ${prop('Input type', ctl('SRT', { select: true }))}
      ${prop('Mode', seg(['Caller', 'Listener']))}
      ${prop('URL', ctl('srt://203.0.113.24:9001?streamid=feed-3', { mono: true }))}
      ${prop('Latency', ctl('120', { mono: true, unit: 'ms', spin: true }))}
      ${prop('Passphrase', ctl('<span style="color:var(--disabled)">Optional, stored encrypted</span>'))}
      <p class="note">Names can be in any language.</p></div>`,
    `<button class="btn">Cancel</button><button class="btn primary">${icon('plus')}Add camera</button>`) },
  addfx: { label: 'Add effect', build: () => {
    const row = (cls, ic, name, desc, req, tag) => `<div class="pick-row ${cls}"><span class="rd"></span><span class="ic">${icon(ic)}</span><div><b>${name}</b><p>${desc}</p>${req ? `<span class="req">${icon('check')}${req}</span>` : ''}</div>${tag ? `<span class="tag2">${tag}</span>` : ''}</div>`;
    return multiviewWin(CAMS4) + dlg('Add effect to CAM 2', `<div class="dlg-b"><div class="pick">
      ${row('sel', 'bg', 'Background', 'Blur the background, replace it with an image or colour, or send fill + key so the switcher keys the person.', 'Needs Background removal, already on this camera')}
      ${row('done', 'color', 'Colour', 'Hold a colour chart (card or tablet) in front of the camera once; BreadCamera corrects and locks it.', '', 'ADDED')}
      ${row('done', 'matte', 'Background removal', 'AI person cut-out without a green screen (NVIDIA Maxine, or ONNX on other GPUs).', '', 'ADDED')}</div>
      <p class="note">New effects appear here when BreadCamera ships them. Each runs in its fixed place in the chain.</p></div>`,
      `<button class="btn">Cancel</button><button class="btn primary">${icon('plus')}Add effect</button>`);
  } },
  addout: { label: 'Add output', build: () => multiviewWin(CAMS4) + dlg('Add output to CAM 2', `<div class="dlg-b">
      ${prop('Output type', ctl('NDI', { select: true }))}
      ${prop('Sends', seg(['Keyed (fill + key)', 'Composited']))}
      ${prop('NDI source name', ctl('BreadCamera (MC chính – Cam 2)'))}
      ${prop('Resolution', ctl('Same as show', { select: true }))}
      ${prop('Frame rate', ctl('Half rate · 29.97', { select: true }))}
      <p class="note">Smaller sizes: 1280×720, 960×540. Frame rate: same as show or half. Other rates are not offered because converting them judders.</p></div>`,
    `<button class="btn">Cancel</button><button class="btn primary">${icon('plus')}Add output</button>`) },
  stopall: { label: 'Stop all outputs', build: () => multiviewWin(CAMS4) + dlg('Stop all outputs?', `<div class="dlg-b">
      <p>Every receiver loses picture now: <strong>9 outputs on 4 cameras</strong> in <strong>Hội nghị Khách hàng 2026</strong>.</p>
      <p>The engine and the show stay open. Start outputs again from each camera.</p></div>`,
    `<button class="btn">Cancel</button><button class="btn danger">${icon('power')}Stop all outputs</button>`) }
};

function sizeWall() {
  document.querySelectorAll('.wall').forEach(w => {
    const n = +w.dataset.n, [cols, rows] = GRID[n], a = w.parentElement;
    const W = a.clientWidth - 8, H = a.clientHeight - 8, strip = 29, gap = 3;
    const tw = Math.floor(Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows - strip) * 16 / 9));
    w.style.gridTemplateColumns = `repeat(${cols}, ${tw}px)`;
  });
}
const bar = document.querySelector('.mockbar');
function show(id) {
  document.getElementById('win').innerHTML = SCREENS[id].build();
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  sizeWall();
}
Object.entries(SCREENS).forEach(([id, s]) => { const b = document.createElement('button'); b.role = 'tab'; b.dataset.id = id; b.textContent = s.label; b.onclick = () => show(id); bar.appendChild(b); });
bar.insertAdjacentHTML('beforeend', '<span class="note">Pictures are synthetic. Camera and show names are user data.</span>');
addEventListener('resize', sizeWall);
show(SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'multiview');
</script>
</body>
</html>
